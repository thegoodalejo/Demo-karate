rootProject.name = 'mi-proyecto-karate'
plugins {
    id 'java'
}

group = 'com.tuempresa'
version = '1.0-SNAPSHOT'

ext {
    karateCoreVersion    = '1.4.1'
    karateApacheVersion  = '0.9.6'
    cucumberVersion      = '5.7.5'
    lombokVersion        = '1.18.34'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation "com.intuit.karate:karate-core:${karateCoreVersion}"
    testImplementation "com.intuit.karate:karate-apache:${karateApacheVersion}"
    testImplementation "net.masterthought:cucumber-reporting:${cucumberVersion}"
    testImplementation "org.json:json:20231013"
    compileOnly         "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

test {
    useJUnitPlatform()
    include '**/karate/**'
    systemProperty 'karate.options', System.properties.getProperty('karate.options')
    systemProperty 'karate.env',     System.properties.getProperty('karate.env')
    systemProperty 'baseUrl',        System.properties.getProperty('baseUrl', 'https://fakerestapi.azurewebsites.net')

    // Autenticación Microsoft Azure AD
    // Local:  ./gradlew test -Dauth.token=eyJhbGci...
    // CI:     ./gradlew test -Dauth.enabled=true -Dauth.tenantId=... -Dauth.clientId=... -Dauth.clientSecret=...
    systemProperty 'auth.token',        System.properties.getProperty('auth.token',        '')
    systemProperty 'auth.enabled',      System.properties.getProperty('auth.enabled',      'false')
    systemProperty 'auth.tenantId',     System.properties.getProperty('auth.tenantId',     '')
    systemProperty 'auth.clientId',     System.properties.getProperty('auth.clientId',     '')
    systemProperty 'auth.clientSecret', System.properties.getProperty('auth.clientSecret', '')
    systemProperty 'auth.scope',        System.properties.getProperty('auth.scope',        '')
    
    outputs.upToDateWhen { false }
    testLogging.showStandardStreams = true
    
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

sourceSets {
    test {
        java {
            srcDir file('src/test/java')
        }
        resources {
            srcDir file('src/test/java')
            exclude '**/*.java'
        }
    }
}